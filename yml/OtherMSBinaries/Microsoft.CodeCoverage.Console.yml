---
Name: Microsoft.CodeCoverage.Console.exe
Description: Command-line code-coverage tool shipped with Visual Studio (Community, Professional and Enterprise). Its collect verb launches an arbitrary child command, and its subprocesses, under instrumentation. The child and its arguments follow the collect options positionally, and run under the intermediate CodeCoverage.exe rather than the real launcher.
Author: Daniel Koifman
Created: 2026-11-26
Commands:
  - Command: Microsoft.CodeCoverage.Console.exe collect --output {PATH_ABSOLUTE:.coverage.xml} --output-format xml --nologo C:\Windows\System32\calc.exe
    Description: Executes an arbitrary command as a child of the signed code-coverage host via CodeCoverage.exe, breaking the parent-process lineage that would normally point at the real launcher.
    Usecase: Proxy execution of an arbitrary binary or command through a Microsoft-signed developer utility
    Category: Execute
    Privileges: User
    MitreID: T1127
    OperatingSystem: Windows 10, Windows 11
    Tags:
      - Execute: EXE
Full_Path:
  - Path: C:\Program Files\Microsoft Visual Studio\18\Community\Common7\IDE\Extensions\Microsoft\CodeCoverage.Console\Microsoft.CodeCoverage.Console.exe
  - Path: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\Extensions\Microsoft\CodeCoverage.Console\Microsoft.CodeCoverage.Console.exe
  - Path: C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\Extensions\Microsoft\CodeCoverage.Console\Microsoft.CodeCoverage.Console.exe
  - Path: C:\Program Files\Microsoft Visual Studio\2022\Professional\Common7\IDE\Extensions\Microsoft\CodeCoverage.Console\Microsoft.CodeCoverage.Console.exe
Detection:
  - IOC: Microsoft.CodeCoverage.Console.exe or CodeCoverage.exe as the parent of a shell or script interpreter such as powershell.exe or cmd.exe
  - IOC: Microsoft.CodeCoverage.Console.exe running on a host with no Visual Studio test workload
Resources:
  - Link: https://learn.microsoft.com/en-us/visualstudio/test/microsoft-code-coverage-console-tool
Acknowledgement:
  - Person: Daniel Koifman
    Handle: '@KoifSec'
